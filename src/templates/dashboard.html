<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telemetry Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-100 font-sans antialiased min-h-screen p-8 selection:bg-indigo-500/30">
    <div class="max-w-5xl mx-auto space-y-8">

        <header class="border-b border-white/10 pb-6 flex items-center justify-between">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">
                    Telemetry Dashboard
                </h1>
                <p class="text-gray-400 text-sm mt-2 font-medium tracking-wide">System Overview</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-xs font-semibold text-emerald-500 tracking-widest uppercase">Connected</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <div class="lg:col-span-2 bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-2xl p-7 shadow-2xl relative overflow-hidden group">
                <h2 class="text-lg font-bold mb-5 text-gray-200 relative z-10 flex items-center gap-2" id="formTitle">
                    <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add Record
                </h2>

                <form id="ingestForm" class="grid grid-cols-1 md:grid-cols-3 gap-5 relative z-10">
                    <input type="hidden" id="edit_id" value="">

                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Device ID</label>
                        <input type="text" id="device_id" value="sensor-node-01" required
                               class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Metric Type</label>
                        <input type="text" id="metric_type" value="temperature" required
                               class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1.5 uppercase tracking-wider">Value</label>
                        <input type="number" step="any" id="value" value="24.5" required
                               class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/50 focus:border-indigo-500 transition-all text-gray-200">
                    </div>
                    <div class="md:col-span-3 flex items-center justify-end">
                        <button type="submit" id="submitBtn" class="bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-indigo-500/25 transition-all text-sm border border-indigo-400/30">
                            Save
                        </button>
                        <button type="button" id="cancelEditBtn" class="hidden ml-2 px-4 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 font-bold rounded-xl border border-white/10 transition-all text-sm" onclick="resetForm()">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <div class="bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-2xl p-7 shadow-2xl flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold mb-2 text-gray-200 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                        Import CSV
                    </h2>
                    <p class="text-xs text-gray-400 mb-4">
                        Upload a CSV file containing: <code class="text-indigo-300">device_id, metric_type, value</code>
                    </p>
                </div>

                <form id="batchForm" class="space-y-4">
                    <input type="file" id="csvFile" accept=".csv" required
                           class="block w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-white/10 file:text-gray-200 hover:file:bg-white/20 transition-all cursor-pointer bg-black/50 border border-white/10 rounded-xl p-1.5">

                    <button type="submit" id="batchSubmitBtn" class="w-full bg-gray-800 hover:bg-gray-700 text-white font-bold py-2.5 px-4 rounded-xl border border-white/10 transition-all text-sm">
                        Upload File
                    </button>
                </form>
                <div id="batchStatus" class="mt-3 text-xs hidden"></div>
            </div>

        </div>

        <div class="bg-white/[0.02] backdrop-blur-xl border border-white/10 rounded-2xl p-7 shadow-2xl">
            <h2 class="text-lg font-bold mb-5 text-gray-200 flex items-center gap-2">
                <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                Recent Activity
            </h2>
            <div class="overflow-x-auto rounded-xl border border-white/5 bg-black/20">
                <table class="w-full text-left text-sm whitespace-nowrap">
                    <thead class="bg-black/40 text-gray-400 uppercase text-xs tracking-wider border-b border-white/10">
                        <tr>
                            <th class="p-4 font-semibold">ID</th>
                            <th class="p-4 font-semibold">Device</th>
                            <th class="p-4 font-semibold">Type</th>
                            <th class="p-4 font-semibold">Value</th>
                            <th class="p-4 font-semibold">Timestamp</th>
                            <th class="p-4 font-semibold text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="metricsTableBody" class="divide-y divide-white/5">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let currentMetrics = [];

        async function fetchMetrics() {
            try {
                const response = await fetch('/api/v1/metrics');
                currentMetrics = await response.json();
                renderTable();
            } catch (err) {
                console.error("Failed to load metrics", err);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('metricsTableBody');
            tbody.innerHTML = '';

            if (currentMetrics.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-gray-500 italic">No records found.</td></tr>`;
                return;
            }

            currentMetrics.forEach(item => {
                const row = document.createElement('tr');
                row.className = "hover:bg-white/[0.02] transition-colors group";
                row.innerHTML = `
                    <td class="p-4 text-gray-500 font-mono text-xs">${item.id}</td>
                    <td class="p-4 font-medium text-gray-200">${item.device_id}</td>
                    <td class="p-4 text-cyan-400/90 font-medium">${item.metric_type}</td>
                    <td class="p-4 text-gray-100 font-mono">${item.value}</td>
                    <td class="p-4 text-gray-500 text-xs font-mono">${new Date(item.timestamp).toLocaleString()}</td>
                    <td class="p-4 text-right space-x-3 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editRecord(${item.id})" class="text-indigo-400 hover:text-indigo-300 font-medium text-xs uppercase tracking-wider transition-colors">Edit</button>
                        <button onclick="deleteRecord(${item.id})" class="text-rose-500 hover:text-rose-400 font-medium text-xs uppercase tracking-wider transition-colors">Delete</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function editRecord(id) {
            const record = currentMetrics.find(m => m.id === id);
            if (!record) return;

            document.getElementById('edit_id').value = record.id;
            document.getElementById('device_id').value = record.device_id;
            document.getElementById('metric_type').value = record.metric_type;
            document.getElementById('value').value = record.value;

            document.getElementById('submitBtn').textContent = 'Update';
            document.getElementById('submitBtn').classList.replace('from-indigo-600', 'from-cyan-600');
            document.getElementById('submitBtn').classList.replace('to-indigo-500', 'to-cyan-500');
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('formTitle').innerHTML = `<svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg> Edit Record`;

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('ingestForm').reset();
            document.getElementById('edit_id').value = '';

            document.getElementById('submitBtn').textContent = 'Save';
            document.getElementById('submitBtn').classList.replace('from-cyan-600', 'from-indigo-600');
            document.getElementById('submitBtn').classList.replace('to-cyan-500', 'to-indigo-500');
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('formTitle').innerHTML = `<svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg> Add Record`;
        }

        async function deleteRecord(id) {
            if (!confirm(`Are you sure you want to delete record ${id}?`)) return;

            try {
                const res = await fetch(`/api/v1/metrics/${id}`, { method: 'DELETE' });
                if (res.ok) fetchMetrics();
            } catch (err) {
                console.error("Failed to delete", err);
            }
        }

        // Single Entry
        document.getElementById('ingestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('edit_id').value;

            const payload = {
                device_id: document.getElementById('device_id').value,
                metric_type: document.getElementById('metric_type').value,
                value: parseFloat(document.getElementById('value').value)
            };

            const url = editId ? `/api/v1/metrics/${editId}` : '/api/v1/ingest';
            const method = editId ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                resetForm();
                fetchMetrics();
            }
        });

        // Batch CSV Upload
        document.getElementById('batchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('csvFile');
            const statusDiv = document.getElementById('batchStatus');
            const submitBtn = document.getElementById('batchSubmitBtn');

            if (!fileInput.files.length) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            submitBtn.disabled = true;
            submitBtn.textContent = 'Uploading...';
            statusDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/v1/ingest/batch', {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok) {
                    statusDiv.textContent = data.message || 'CSV successfully imported.';
                    statusDiv.className = 'mt-3 text-xs text-emerald-400 font-medium';
                    fileInput.value = '';
                    fetchMetrics();
                } else {
                    statusDiv.textContent = data.detail || 'Import failed.';
                    statusDiv.className = 'mt-3 text-xs text-rose-400 font-medium';
                }
            } catch (err) {
                statusDiv.textContent = 'Network error while uploading file.';
                statusDiv.className = 'mt-3 text-xs text-rose-400 font-medium';
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Upload File';
                statusDiv.classList.remove('hidden');
            }
        });

        fetchMetrics();
        setInterval(fetchMetrics, 5000);
    </script>
</body>
</html>
